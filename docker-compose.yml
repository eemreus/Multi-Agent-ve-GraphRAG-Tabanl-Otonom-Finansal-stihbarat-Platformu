# Yerel geliştirme için Neo4j ve PostgreSQL. Çalıştırma: docker compose up -d
# Tarayıcı arayüzü: http://localhost:7474  (kullanıcı: neo4j, parola: .env içindeki NEO4J_PASSWORD)
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: paragoz-neo4j
    ports:
      - "7474:7474"   # web arayüzü
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-paragoz-dev-sifre}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_PASSWORD:-paragoz-dev-sifre} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
  postgres:
    image: postgres:16
    container_name: paragoz-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: paragoz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paragoz-dev-sifre}
      POSTGRES_DB: paragoz
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paragoz -d paragoz"]
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    container_name: paragoz-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  neo4j_data:
  postgres_data:
