# Yerel geliştirme: Neo4j, PostgreSQL, Redis ve (mikro servis) gateway + graphrag-agent.
# Yalnızca veritabanları:   docker compose up -d neo4j postgres redis
# Tüm sistem:               docker compose up -d --build   (Ollama ana makinede çalışıyor olmalı)
# Tarayıcı arayüzü: http://localhost:7474  (kullanıcı: neo4j, parola: .env içindeki NEO4J_PASSWORD)
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: paragoz-neo4j
    ports:
      - "7474:7474"   # web arayüzü
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-paragoz-dev-sifre}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_PASSWORD:-paragoz-dev-sifre} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
  postgres:
    image: postgres:16
    container_name: paragoz-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: paragoz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paragoz-dev-sifre}
      POSTGRES_DB: paragoz
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paragoz -d paragoz"]
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    container_name: paragoz-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
  graphrag-agent:
    build: .
    container_name: paragoz-graphrag-agent
    command: uvicorn src.agent.main:app --host 0.0.0.0 --port 8001
    # İç servis: ana makineye port açılmaz, yalnızca gateway erişir.
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-gelistirme-ic-anahtar}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-paragoz-dev-sifre}
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8001/saglik')"]
      interval: 10s
      timeout: 5s
      retries: 12
  gateway:
    build: .
    container_name: paragoz-gateway
    ports:
      - "8000:8000"
    environment:
      API_KEYS: ${API_KEYS:-gelistirme-anahtari}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-30}
      AGENT_URL: http://graphrag-agent:8001
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-gelistirme-ic-anahtar}
      DATABASE_URL: postgresql+psycopg://paragoz:${POSTGRES_PASSWORD:-paragoz-dev-sifre}@postgres:5432/paragoz
      REDIS_URL: redis://redis:6379/0
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
    depends_on:
      graphrag-agent:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
volumes:
  neo4j_data:
  postgres_data:
